<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        :root {
            --glow-color: #7289da;
            --glow-strength: 10px;
            --text-color: #ffffff;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        #background-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        #background-container video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); }
        .profile-card { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; position: relative; z-index: 1; padding: 20px; box-sizing: border-box; opacity: 0; transition: opacity 1s ease; }
        .profile-card.loaded { opacity: 1; }
        .avatar { width: 128px; height: 128px; border-radius: 50%; border: 3px solid var(--glow-color); box-shadow: 0 0 20px var(--glow-color); margin-bottom: 20px; }
        .username { font-size: 3em; font-weight: 700; color: var(--text-color); text-shadow: 0 0 var(--glow-strength) var(--glow-color); margin: 0; }
        .bio { font-size: 1.1em; color: #d1d1d1; max-width: 500px; margin-top: 10px; text-shadow: 0 0 5px rgba(0,0,0,0.7); }
        .links { margin-top: 25px; display: flex; gap: 25px; }
        .links a { color: var(--text-color); text-decoration: none; transition: transform 0.3s ease, filter 0.3s ease; }
        .links a:hover { transform: scale(1.1); filter: drop-shadow(0 0 8px var(--glow-color)); }
        .links svg { width: 32px; height: 32px; }
        .status-message { color: #fff; font-size: 1.5em; }
    </style>
</head>
<body>
    <div id="background-container">
        <video id="bg-video" autoplay muted loop playsinline></video>
    </div>
    <div class="overlay"></div>

    <main id="profile-card" class="profile-card">
        <!-- Content will be populated by JavaScript -->
        <div id="status-message" class="status-message">Loading Profile...</div>
    </main>
    
    <script>
        const icons = {
            discord: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.22,4.31H3.78A1.78,1.78,0,0,0,2,6.09V17.91A1.78,1.78,0,0,0,3.78,19.69h13L22,22V6.09A1.78,1.78,0,0,0,20.22,4.31ZM8.63,14.59a1.59,1.59,0,1,1,1.59-1.59A1.59,1.59,0,0,1,8.63,14.59Zm6.74,0a1.59,1.59,0,1,1,1.59-1.59A1.59,1.59,0,0,1,15.37,14.59Z"/></svg>`,
            paypal: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.204,6.723l2.67-0.013c0.169-1.049,0.852-1.92,2.004-1.92c1.33,0,1.905,0.6,1.905,1.446c0,0.59-0.282,1.036-0.812,1.382l-0.675,0.443c-0.858,0.562-1.229,1.219-1.229,2.002v0.121h3.333c0-0.658,0.283-1.093,0.83-1.424l0.627-0.378c0.822-0.495,1.213-1.144,1.213-1.944c0-1.37-1.118-2.31-2.923-2.31c-1.836,0-2.84,0.95-3.111,2.599H3.204z M17.276,6.592c-0.375,0-0.6,0.141-0.702,0.45l-2.618,8.216h3.427l0.428-1.411h2.333l0.218,1.411h3.193l-2.4-8.666H17.276z M17.925,12.234l0.825-2.731l0.506,2.731H17.925z"/></svg>`,
            tiktok: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02c.08 1.53.63 3.09 1.75 4.17c1.12 1.11 2.7 1.65 4.3 1.71c.02 1.31.01 2.61.02 3.91c-1.53-.05-3.09-.6-4.17-1.73c-1.11-1.12-1.65-2.7-1.71-4.3zM10.125 7.625c.02 1.31.01 2.61.02 3.91c-1.53-.05-3.09-.6-4.17-1.73C4.865 8.695 4.325 7.135 4.265 5.605c-1.31.02-2.61.01-3.91.02c.05 1.53.6 3.09 1.73 4.17c1.12 1.11 2.7 1.65 4.3 1.71c.02 1.31.01 2.61.02 3.91c-1.53-.05-3.09-.6-4.17-1.73c-1.11-1.12-1.65-2.7-1.71-4.3c-1.31.02-2.61.01-3.91.02c.05 1.53.6 3.09 1.73 4.17c1.12 1.11 2.7 1.65 4.3 1.71V24h3.91V.02h-3.91z"/></svg>`,
            roblox: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.95 22.95L1.05 1.05 20.244 3.756l-2.7 16.491zM3.756 20.244l16.491-2.7L22.95 1.05 1.05 22.95z"/></svg>`,
            custom: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 13.41c.41.39.41 1.02 0 1.41-.39.39-1.02.39-1.41 0a.996.996 0 0 1 0-1.41c.39-.39 1.03-.39 1.41 0zM14.83 14.83c-.39-.39-.39-1.02 0-1.41.39-.39 1.02-.39 1.41 0 .39.39.39 1.02 0 1.41-.39.39-1.02.39-1.41 0zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>`
        };

        function renderProfile(data) {
            const card = document.getElementById('profile-card');
            const videoEl = document.getElementById('bg-video');

            document.documentElement.style.setProperty('--glow-color', data.glowColor || '#7289da');
            document.title = `${data.username}'s Profile`;
            
            videoEl.src = data.backgroundUrl;
            videoEl.poster = data.backgroundPoster || '';
            
            card.innerHTML = `
                <img src="${data.avatarUrl}" class="avatar" alt="User Avatar">
                <h1 class="username">${data.username}</h1>
                <p class="bio">${data.bio || ''}</p>
                <div id="links" class="links"></div>
            `;

            const linksContainer = document.getElementById('links');
            for (const [key, url] of Object.entries(data.links || {})) {
                if (url) {
                    const link = document.createElement('a');
                    link.href = url;
                    link.target = '_blank';
                    link.innerHTML = icons[key] || icons['custom'];
                    linksContainer.appendChild(link);
                }
            }
            card.classList.add('loaded');
        }

        function renderError(message) {
            const card = document.getElementById('profile-card');
            card.innerHTML = `<div class="status-message">❌ ${message}</div>`;
            card.classList.add('loaded');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const userId = params.get('id');

            if (!userId) {
                return renderError("No User ID provided in the URL. (e.g., ?id=1000483610190675988)");
            }

            try {
                // This is the API endpoint you need to create on your bot's backend.
                // It must be accessible from the public internet.
                const response = await fetch(`https://your-bot-api-url.com/profile/${userId}`);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `User not found or has no profile.`);
                }

                const profileData = await response.json();
                renderProfile(profileData);

            } catch (error) {
                console.error("Failed to fetch profile data:", error);
                renderError(error.message);
            }
        });
    </script>
</body>
</html>
